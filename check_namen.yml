name: 🔍 Spelersnamen Controleren

on:
  workflow_dispatch:
    inputs:
      speler2:
        description: 'Naam medespeler 2'
        required: true
      speler3:
        description: 'Naam medespeler 3'
        required: true
      speler4:
        description: 'Naam medespeler 4'
        required: true

jobs:
  check-namen:
    name: Namen controleren in KNLTB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Code ophalen
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🌐 Chrome installeren
        uses: browser-actions/setup-chrome@v1

      - name: 📦 Pakketten installeren
        run: pip install selenium webdriver-manager

      - name: 🔍 Namen controleren
        env:
          KNLTB_BONDSNUMMER:    ${{ secrets.KNLTB_BONDSNUMMER }}
          KNLTB_WACHTWOORD:     ${{ secrets.KNLTB_WACHTWOORD }}
          KNLTB_CLUB:           ${{ secrets.KNLTB_CLUB }}
          GMAIL_ADRES:          ${{ secrets.GMAIL_ADRES }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        run: |
          python boek_baan.py --check-namen \
            --speler2 "${{ github.event.inputs.speler2 }}" \
            --speler3 "${{ github.event.inputs.speler3 }}" \
            --speler4 "${{ github.event.inputs.speler4 }}"

      - name: 📸 Screenshot opslaan bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naamcheck-screenshots
          path: '*.png'
          retention-days: 3
