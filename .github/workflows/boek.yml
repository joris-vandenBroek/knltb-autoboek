name: Reserveer Padelbaan

on:
  workflow_dispatch:
    inputs:
      datum:
        description: 'Speeldatum (YYYY-MM-DD)'
        required: true
      tijd:
        description: 'Voorkeurstijd (HH:MM)'
        required: true
      speler2:
        description: 'Naam medespeler 2'
        required: true
      speler3:
        description: 'Naam medespeler 3'
        required: true
      speler4:
        description: 'Naam medespeler 4'
        required: true
      dry_run:
        description: 'Dry-run: loop flow door zonder echte reservering bij ETV'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Voorkom dat parallelle PWA-taps of cron + handmatige retry twee Selenium-
# sessies tegen hetzelfde ETV-account aanjagen (race op reserveringen.json
# commit + ETV "1 actieve reservering"-rule). Groep is per-user â€” bij
# toekomstige multi-user wordt 'joris' parameterized.
concurrency:
  group: knltb-account-joris
  cancel-in-progress: false

jobs:
  boek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues:   write
      actions:  write    # nodig om beheer_reserveringen.yml te triggeren na success
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install undetected-chromedriver selenium \
                      google-api-python-client google-auth

      - name: Reserveer baan
        env:
          DISPLAY:                      :99
          ETVVOLLEY_BONDSNUMMER:            ${{ secrets.ETVVOLLEY_BONDSNUMMER }}
          ETVVOLLEY_WACHTWOORD:             ${{ secrets.ETVVOLLEY_WACHTWOORD }}
          GOOGLE_CALENDAR_CREDENTIALS:  ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID:           ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          python boek_baan.py \
            --datum   "${{ inputs.datum }}" \
            --tijd    "${{ inputs.tijd }}" \
            --speler2 "${{ inputs.speler2 }}" \
            --speler3 "${{ inputs.speler3 }}" \
            --speler4 "${{ inputs.speler4 }}" \
            $DRY_FLAG

      - name: Trigger scrape reserveringen.json na succesvolle echte boeking
        if: success() && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Direct na een succesvolle boeking trigger beheer_reserveringen
          # zodat reserveringen.json bijgewerkt wordt (incl. spelers via
          # Wijzig-flow scrape). PWA polled vervolgens automatisch â€” geen
          # handmatige Verversen-klik meer nodig.
          # Concurrency-group serialiseert deze met andere account-runs.
          gh workflow run beheer_reserveringen.yml --ref main || \
            echo "::warning::beheer_reserveringen trigger faalde â€” verversen-knop in PWA is fallback"

      - name: Screenshots bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
          retention-days: 3

      - name: Open issue bij failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          titel="âŒ boek.yml faalt: ${{ inputs.datum }} ${{ inputs.tijd }} (run #${{ github.run_number }})"
          body=$(cat <<EOF
          Run faalde â€” automatisch gemeld door boek.yml.

          - **Speeldatum:** ${{ inputs.datum }}
          - **Tijd:** ${{ inputs.tijd }}
          - **Spelers:** ${{ inputs.speler2 }}, ${{ inputs.speler3 }}, ${{ inputs.speler4 }}
          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Screenshots-artifact:** beschikbaar 3 dagen

          Sluit dit issue zodra je 't bekeken hebt. Een nieuwe failure maakt een nieuw issue.
          EOF
          )
          gh issue create --title "$titel" --body "$body" --label "auto-failure,boek" || \
            gh issue create --title "$titel" --body "$body"

