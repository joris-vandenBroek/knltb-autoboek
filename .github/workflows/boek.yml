name: Reserveer baan

on:
  workflow_dispatch:
    inputs:
      gebruiker:
        description: 'Gebruiker-ID (uit gebruikers.json)'
        required: true
        default: 'joris_van_den_broek'
      datum:
        description: 'Speeldatum (YYYY-MM-DD)'
        required: true
      tijd:
        description: 'Voorkeurstijd (HH:MM)'
        required: true
      speler2:
        description: 'Naam medespeler 2'
        required: true
      speler3:
        description: 'Naam medespeler 3'
        required: true
      speler4:
        description: 'Naam medespeler 4'
        required: true
      sport:
        description: 'Sport (padel of tennis)'
        required: false
        default: 'padel'
        type: choice
        options:
          - 'padel'
          - 'tennis'
      dry_run:
        description: 'Dry-run: loop flow door zonder echte reservering bij ETV'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: knltb-account-${{ inputs.gebruiker }}
  cancel-in-progress: false

jobs:
  boek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues:   write
      actions:  write
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install -r requirements.txt

      - name: Stel gebruiker-credentials in
        env:
          GEBRUIKERS_CONFIG: ${{ secrets.GEBRUIKERS_CONFIG }}
        run: |
          gebruiker="${{ inputs.gebruiker }}"
          bondsnummer=$(echo "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].bondsnummer')
          wachtwoord=$(echo  "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].wachtwoord')
          naam=$(echo         "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].naam')
          if [ "$bondsnummer" = "null" ] || [ -z "$bondsnummer" ]; then
            echo "Gebruiker '$gebruiker' niet gevonden in GEBRUIKERS_CONFIG"
            exit 1
          fi
          calendar_id=$(echo "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].calendar_id // empty')
          echo "ETVVOLLEY_BONDSNUMMER=$bondsnummer" >> $GITHUB_ENV
          echo "ETVVOLLEY_WACHTWOORD=$wachtwoord"  >> $GITHUB_ENV
          echo "SPELER1_NAAM=$naam"                >> $GITHUB_ENV
          echo "GEBRUIKER=$gebruiker"              >> $GITHUB_ENV
          echo "GOOGLE_CALENDAR_ID=$calendar_id"   >> $GITHUB_ENV

      - name: Reserveer baan
        id: boek
        env:
          DISPLAY:                     :99
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          python boek_baan.py \
            --datum   "${{ inputs.datum }}" \
            --tijd    "${{ inputs.tijd }}" \
            --sport   "${{ inputs.sport || 'padel' }}" \
            --speler2 "${{ inputs.speler2 }}" \
            --speler3 "${{ inputs.speler3 }}" \
            --speler4 "${{ inputs.speler4 }}" \
            $DRY_FLAG

      - name: Ruim wachtrij-bestand op na succesvolle boeking
        if: success() && inputs.dry_run != 'true' && steps.boek.outputs.boek_resultaat != 'wachtrij'
        run: |
          gebruiker="${{ inputs.gebruiker }}"
          datum="${{ inputs.datum }}"
          tijd="${{ inputs.tijd }}"
          tijd_slug="${tijd/:/}"
          bestand="wachtrij/${gebruiker}/${datum}_${tijd_slug}.json"
          if [ -f "$bestand" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "knltb-autoboek-bot"
            git rm "$bestand"
            git commit -m "wachtrij: verwijder ${datum} om ${tijd} na succesvolle boeking"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push poging $i mislukt, retry..."
              sleep $i
            done
          else
            echo "Geen wachtrij-bestand gevonden voor ${gebruiker} ${datum} ${tijd} -- niets op te ruimen."
          fi

      - name: Trigger scrape reserveringen na succesvolle echte boeking
        if: success() && inputs.dry_run != 'true' && steps.boek.outputs.boek_resultaat != 'wachtrij'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run beheer_reserveringen.yml --ref main \
            --field gebruiker="${{ inputs.gebruiker }}" || \
            echo "::warning::beheer_reserveringen trigger faalde"

      - name: Screenshots bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
          retention-days: 3

      - name: Open issue bij failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          titel="boek.yml faalt: ${{ inputs.gebruiker }} ${{ inputs.datum }} ${{ inputs.tijd }} (run #${{ github.run_number }})"
          body=$(cat <<EOF
          Run faalde -- automatisch gemeld door boek.yml.

          - **Gebruiker:** ${{ inputs.gebruiker }}
          - **Sport:** ${{ inputs.sport || 'padel' }}
          - **Speeldatum:** ${{ inputs.datum }}
          - **Tijd:** ${{ inputs.tijd }}
          - **Spelers:** ${{ inputs.speler2 }}, ${{ inputs.speler3 }}, ${{ inputs.speler4 }}
          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Sluit dit issue zodra je het bekeken hebt.
          EOF
          )
          gh issue create --title "$titel" --body "$body" --label "auto-failure,boek" || \
            gh issue create --title "$titel" --body "$body"
