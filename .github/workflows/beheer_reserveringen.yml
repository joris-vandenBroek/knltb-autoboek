name: Beheer Reserveringen

# Workflow_dispatch met optionele cancel_id input.
# - Zonder cancel_id: scrape reserveringen en update reserveringen.json
# - Met cancel_id (formaat YYYY-MM-DD_HHMM_baan-slug): annuleer die reservering,
#   dan scrape opnieuw en update reserveringen.json.
# Wordt aangeroepen door de PWA (verversen-knop + prullenbakje per reservering).

on:
  workflow_dispatch:
    inputs:
      cancel_id:
        description: 'ID van te annuleren reservering (laat leeg om alleen te scrapen)'
        required: false
        default: ''
  schedule:
    - cron: '30 5 * * *'  # Dagelijks 07:30 NL (CEST) / 06:30 (CET)

# Eigen concurrency-groep zodat scrapen/annuleren niet geblokkeerd wordt
# door een wachtende boek.yml run. cancel-in-progress: true zodat een
# nieuwe verversen-aanvraag de vorige (nog wachtende) weggooit i.p.v.
# zelf weggegooid te worden.
concurrency:
  group: knltb-beheer-joris
  cancel-in-progress: true

jobs:
  beheer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues:   write
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install undetected-chromedriver selenium \
                      google-api-python-client google-auth

      - name: Beheer reserveringen
        env:
          DISPLAY:                     :99
          ETVVOLLEY_BONDSNUMMER:       ${{ secrets.ETVVOLLEY_BONDSNUMMER }}
          ETVVOLLEY_WACHTWOORD:        ${{ secrets.ETVVOLLEY_WACHTWOORD }}
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID:          ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          if [ -n "${{ inputs.cancel_id }}" ]; then
            python lees_reserveringen.py --cancel "${{ inputs.cancel_id }}"
          else
            python lees_reserveringen.py
          fi

      - name: Screenshots bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-reserveringen
          path: '*.png'
          retention-days: 3

      - name: Open issue bij failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          actie="scrape"
          if [ -n "${{ inputs.cancel_id }}" ]; then actie="annuleer ${{ inputs.cancel_id }}"; fi
          titel="beheer_reserveringen faalt: $actie (run #${{ github.run_number }})"
          body="Beheer-actie gefaald.

          - Actie: $actie
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          reserveringen.json is mogelijk niet ge-update. Probeer verversen in de PWA."
          gh issue create --title "$titel" --body "$body" --label "auto-failure,beheer" || \
            gh issue create --title "$titel" --body "$body"
