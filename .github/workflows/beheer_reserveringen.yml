name: Beheer Reserveringen

# - Zonder cancel_id: scrape reserveringen en update reserveringen_{gebruiker}.json
# - Met cancel_id: annuleer die reservering, dan scrape opnieuw
# - gebruiker='alle' of schedule: alle gebruikers parallel via matrix

on:
  workflow_dispatch:
    inputs:
      gebruiker:
        description: 'Gebruiker-ID (uit gebruikers.json), of "alle"'
        required: false
        default: 'joris_van_den_broek'
      cancel_id:
        description: 'ID van te annuleren reservering (laat leeg om alleen te scrapen)'
        required: false
        default: ''
  schedule:
    - cron: '30 5 * * *'  # Dagelijks 07:30 NL (CEST) / 06:30 (CET)

jobs:
  # Stap 1: bepaal matrix via GitHub API (geen volledige checkout nodig).
  setup:
    runs-on: ubuntu-latest
    outputs:
      gebruikers: ${{ steps.matrix.outputs.gebruikers }}
    steps:
      - name: Bepaal gebruikers-matrix
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.gebruiker }}" = "alle" ]; then
            gebruikers=$(curl -sf \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/gebruikers.json" \
              | jq -c '[.[].id]')
          else
            gebruiker="${{ inputs.gebruiker || 'joris_van_den_broek' }}"
            gebruikers=$(jq -cn --arg u "$gebruiker" '[$u]')
          fi
          echo "gebruikers=$gebruikers" >> $GITHUB_OUTPUT

  # Stap 2: verwerk elke gebruiker in een aparte parallelle job.
  beheer:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues:   write
    env:
      TZ: Europe/Amsterdam
    strategy:
      matrix:
        gebruiker: ${{ fromJson(needs.setup.outputs.gebruikers) }}
      fail-fast: false  # één gebruiker die faalt stopt de rest niet
    concurrency:
      group: knltb-beheer-${{ matrix.gebruiker }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install -r requirements.txt

      - name: Stel gebruiker-credentials in
        env:
          GEBRUIKERS_CONFIG: ${{ secrets.GEBRUIKERS_CONFIG }}
        run: |
          gebruiker="${{ matrix.gebruiker }}"
          bondsnummer=$(echo "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].bondsnummer')
          wachtwoord=$(echo  "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].wachtwoord')
          naam=$(echo        "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].naam')
          if [ "$bondsnummer" = "null" ] || [ -z "$bondsnummer" ]; then
            echo "Gebruiker '$gebruiker' niet gevonden in GEBRUIKERS_CONFIG"
            exit 1
          fi
          calendar_id=$(echo "$GEBRUIKERS_CONFIG" | jq -r --arg u "$gebruiker" '.[$u].calendar_id // empty')
          echo "ETVVOLLEY_BONDSNUMMER=$bondsnummer" >> $GITHUB_ENV
          echo "ETVVOLLEY_WACHTWOORD=$wachtwoord"  >> $GITHUB_ENV
          echo "SPELER1_NAAM=$naam"                >> $GITHUB_ENV
          echo "GEBRUIKER=$gebruiker"              >> $GITHUB_ENV
          echo "GOOGLE_CALENDAR_ID=$calendar_id"   >> $GITHUB_ENV

      - name: Beheer reserveringen
        env:
          DISPLAY:                     :99
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID:          ${{ env.GOOGLE_CALENDAR_ID }}
          GEBRUIKERS_CONFIG:           ${{ secrets.GEBRUIKERS_CONFIG }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          if [ -n "${{ inputs.cancel_id }}" ]; then
            python lees_reserveringen.py --cancel "${{ inputs.cancel_id }}"
          else
            python lees_reserveringen.py
          fi

      - name: Screenshots bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.gebruiker }}
          path: '*.png'
          retention-days: 3

      - name: Open issue bij failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actie="scrape"
          if [ -n "${{ inputs.cancel_id }}" ]; then actie="annuleer ${{ inputs.cancel_id }}"; fi
          titel="beheer_reserveringen faalt: ${{ matrix.gebruiker }} $actie (run #${{ github.run_number }})"
          body="Beheer-actie gefaald.

          - Gebruiker: ${{ matrix.gebruiker }}
          - Actie: $actie
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          reserveringen.json is mogelijk niet ge-update."
          gh issue create --title "$titel" --body "$body" --label "auto-failure,beheer" || \
            gh issue create --title "$titel" --body "$body"
