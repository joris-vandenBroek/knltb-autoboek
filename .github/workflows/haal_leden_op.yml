name: Ledenlijst ophalen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'  # Elke maandag 07:00 CEST

jobs:
  haal-leden-op:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions:  write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install -r requirements.txt

      - name: Leden ophalen
        env:
          DISPLAY: :99
          GEBRUIKERS_CONFIG: ${{ secrets.GEBRUIKERS_CONFIG }}
        run: |
          bondsnummer=$(echo "$GEBRUIKERS_CONFIG" | jq -r '.joris_van_den_broek.bondsnummer')
          wachtwoord=$(echo  "$GEBRUIKERS_CONFIG" | jq -r '.joris_van_den_broek.wachtwoord')
          if [ "$bondsnummer" = "null" ] || [ -z "$bondsnummer" ]; then
            echo "joris_van_den_broek niet gevonden in GEBRUIKERS_CONFIG"
            exit 1
          fi
          export ETVVOLLEY_BONDSNUMMER="$bondsnummer"
          export ETVVOLLEY_WACHTWOORD="$wachtwoord"
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python haal_leden_op.py

      - name: leden.json committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leden.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen aan leden.json -- niets te committen."
            exit 0
          fi
          git commit -m "Ledenlijst bijgewerkt"
          for i in 1 2 3 4 5; do
            git stash --include-untracked || true
            git pull --rebase origin main
            git stash pop || true
            if git push; then
              echo "Push gelukt (poging $i)"
              exit 0
            fi
            echo "Push poging $i mislukt -- opnieuw na ${i}s"
            sleep "$i"
          done
          echo "Push faalde na 5 pogingen"
          exit 1

      - name: Trigger haal_padel_sterktes.yml
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run haal_padel_sterktes.yml --ref main
          echo "haal_padel_sterktes.yml getriggerd"

      - name: Screenshots bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leden-screenshots
          path: '*.png'
          retention-days: 3
