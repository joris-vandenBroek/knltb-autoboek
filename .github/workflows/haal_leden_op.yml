name: Ledenlijst ophalen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'  # Elke maandag 07:00 CEST

jobs:
  haal-leden-op:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install undetected-chromedriver selenium

      - name: Leden ophalen
        env:
          DISPLAY: :99
          KNLTB_BONDSNUMMER: ${{ secrets.KNLTB_BONDSNUMMER }}
          KNLTB_WACHTWOORD:  ${{ secrets.KNLTB_WACHTWOORD }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python haal_leden_op.py

      - name: leden.json committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leden.json
          git diff --cached --quiet || git commit -m "Ledenlijst bijgewerkt"
          git push

      - name: Screenshots bij fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leden-screenshots
          path: '*.png'
          retention-days: 3
