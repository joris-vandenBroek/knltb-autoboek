name: Verwerk wachtrij

# Getriggerd door cron-job.org om 06:50 NL (tijdzone-onafhankelijk).
# Loopt door alle gebruiker-subfolders in wachtrij/ en triggert boek.yml
# per item met de juiste gebruiker.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions:  write
  issues:   write

concurrency:
  group: knltb-verwerk-wachtrij
  cancel-in-progress: false

jobs:
  verwerk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4

      - name: Healthcheck-ping (start)
        if: env.HEALTHCHECK_PING_URL != ''
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl -fsS --retry 3 -o /dev/null "${HEALTHCHECK_PING_URL}/start" || true

      - name: Skip als niet binnen 06:55-07:30 NL
        id: tijd_check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            nl_hm=$(date +%H%M)
            if [ "$nl_hm" -lt 655 ] || [ "$nl_hm" -gt 730 ]; then
              echo "Schedule fired buiten venster 06:55-07:30 NL (nu ${nl_hm}) -- overslaan."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Schedule fired binnen venster (nu ${nl_hm} NL) -- verwerk wachtrij."
          else
            echo "Handmatig getriggerd -- verwerk altijd."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Trigger boek.yml voor items die vandaag geboekt worden
        if: steps.tijd_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          today=$(date +%Y-%m-%d)
          triggered=0
          fouten=0
          shopt -s nullglob

          # Loop door alle gebruiker-subfolders
          for gebruiker_dir in wachtrij/*/; do
            gebruiker=$(basename "$gebruiker_dir")
            for f in "${gebruiker_dir}"*.json; do
              # Per-item foutafhandeling: corrupt JSON stopt niet de rest van de items
              if ! jq -e '.' "$f" > /dev/null 2>&1; then
                echo "::warning::Corrupt of leeg wachtrij-bestand: $f — overgeslagen"
                fouten=$((fouten + 1))
                continue
              fi
              datum=$(jq -r '.datum'            "$f")
              tijd=$(jq -r  '.tijd'             "$f")
              sport=$(jq -r '.sport // "padel"' "$f")
              speler2=$(jq -r '.spelers[1]'     "$f")
              speler3=$(jq -r '.spelers[2]'     "$f")
              speler4=$(jq -r '.spelers[3]'     "$f")
              if [ -z "$datum" ] || [ "$datum" = "null" ]; then
                echo "::warning::Ontbrekend datum-veld in $f — overgeslagen"
                fouten=$((fouten + 1))
                continue
              fi
              reserveringsdatum=$(date -d "$datum - 2 days" +%Y-%m-%d)
              if [ "$reserveringsdatum" = "$today" ]; then
                echo "Trigger boek.yml: $gebruiker $datum om $tijd $sport ($f)"
                gh workflow run boek.yml \
                  --field gebruiker="$gebruiker" \
                  --field datum="$datum" \
                  --field tijd="$tijd" \
                  --field sport="$sport" \
                  --field speler2="$speler2" \
                  --field speler3="$speler3" \
                  --field speler4="$speler4"
                triggered=$((triggered + 1))
              else
                echo "Skip $f (reserveringsdatum $reserveringsdatum, niet vandaag $today)"
              fi
            done
          done
          echo "Getriggerd: $triggered boek.yml run(s)"
          if [ "$fouten" -gt 0 ]; then
            echo "::error::$fouten wachtrij-bestand(en) overgeslagen wegens fouten — check de warnings hierboven"
            exit 1
          fi

      - name: Healthcheck-ping (succes)
        if: success() && env.HEALTHCHECK_PING_URL != ''
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl -fsS --retry 3 -o /dev/null "${HEALTHCHECK_PING_URL}" || true

      - name: Healthcheck-ping (fail)
        if: failure() && env.HEALTHCHECK_PING_URL != ''
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl -fsS --retry 3 -o /dev/null "${HEALTHCHECK_PING_URL}/fail" || true

      - name: Open issue bij failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          titel="verwerk_wachtrij faalt (run #${{ github.run_number }})"
          body=$(cat <<EOF
          Wachtrij-verwerking gefaald.

          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Trigger:** ${{ github.event_name }}

          Eventuele boekingen zijn dus NIET getriggerd. Check wachtrij/ folder.
          EOF
          )
          gh issue create --title "$titel" --body "$body" --label "auto-failure,wachtrij" || \
            gh issue create --title "$titel" --body "$body"
