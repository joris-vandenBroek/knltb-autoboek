name: Verwerk Wachtrij

# Draait twee keer per dag: 04:55 UTC (= 06:55 NL zomertijd / 05:55 NL wintertijd)
# en 05:55 UTC (= 07:55 NL zomertijd / 06:55 NL wintertijd). De job zelf
# controleert of de NL-tijd binnen het venster 06:55-07:30 valt en slaat anders
# over. Effectief: één run per dag om 06:55 NL — met buffer voor cold-start delay
# (GitHub Actions cron kan tot ~15 min vertraagd worden).
# boek_baan.py wacht vervolgens zelf tot 07:01 NL voor de daadwerkelijke reservering.

on:
  schedule:
    - cron: '55 4 * * *'   # 06:55 CEST (zomertijd, UTC+2)
    - cron: '55 5 * * *'   # 06:55 CET  (wintertijd, UTC+1)
  workflow_dispatch:

permissions:
  contents: write
  actions:  write
  issues:   write

# Eigen concurrency-groep voor verwerk_wachtrij zodat dubbele cron-firings
# (zomertijd + wintertijd, of cron-job.org + GitHub native) elkaar niet
# dupliceren — maar NIET de boek/beheer-groep: anders wacht de cron-run
# op eventuele achterliggende handmatige boek-runs en start de echte
# boeking te laat (run #79 was 35 min vertraagd hierdoor).
# boek.yml-runs die verwerk_wachtrij triggert krijgen WEL de boek-groep
# zodat die onderling geserialiseerd blijven.
concurrency:
  group: knltb-verwerk-wachtrij
  cancel-in-progress: false

jobs:
  verwerk:
    runs-on: ubuntu-latest
    # 35 min: lang genoeg om 1+ boek.yml runs (elk max ~15 min) af te
    # wachten alvorens 't wachtrij-bestand te verwijderen. Bij faal
    # blijft het bestand staan voor handmatige bekijking / retry.
    timeout-minutes: 35
    env:
      TZ: Europe/Amsterdam
    steps:
      - uses: actions/checkout@v4

      - name: Healthcheck-ping (start)
        if: env.HEALTHCHECK_PING_URL != ''
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          # Pingen aan begin van een verwacht-getriggerde run. Healthchecks.io
          # raakt alert als deze ping >24u uitblijft → dead-man's-switch voor
          # cron-job.org / GitHub native cron / PAT-verloop.
          curl -fsS --retry 3 -o /dev/null "${HEALTHCHECK_PING_URL}/start" || true

      - name: Skip als niet binnen 06:55-07:30 NL
        id: tijd_check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            nl_hm=$(date +%H%M)
            # Venster: 06:55 t/m 07:30 NL. Buiten dit venster is de cron
            # gefired in de "verkeerde" DST-helft of veel te laat door delay.
            if [ "$nl_hm" -lt 655 ] || [ "$nl_hm" -gt 730 ]; then
              echo "⏭️  Schedule fired buiten venster 06:55-07:30 NL (nu ${nl_hm}) — overslaan."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "✅ Schedule fired binnen venster (nu ${nl_hm} NL) — verwerk wachtrij."
          else
            echo "🔧 Handmatig getriggerd — verwerk altijd."
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Verwerk wachtrij-bestanden voor vandaag
        if: steps.tijd_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p wachtrij
          today=$(date +%Y-%m-%d)
          today_epoch=$(date -d "$today" +%s)
          # TTL: wachtrij-items met 'ingediend' ouder dan 60 dagen worden
          # automatisch opgeruimd (zonder boek-trigger). Voorkomt dat een
          # half-vergeten plan van maanden terug spontaan in actie komt.
          MAX_LEEFTIJD_DAGEN=60
          processed=0
          verlopen=0
          shopt -s nullglob
          for f in wachtrij/*.json; do
            datum=$(jq -r '.datum'      "$f")
            tijd=$(jq -r  '.tijd'       "$f")
            ingediend=$(jq -r '.ingediend // empty' "$f")
            speler2=$(jq -r '.spelers[1]' "$f")
            speler3=$(jq -r '.spelers[2]' "$f")
            speler4=$(jq -r '.spelers[3]' "$f")

            # TTL-check
            if [ -n "$ingediend" ]; then
              ingediend_date="${ingediend%%T*}"
              ingediend_epoch=$(date -d "$ingediend_date" +%s 2>/dev/null || echo 0)
              leeftijd_dagen=$(( (today_epoch - ingediend_epoch) / 86400 ))
              if [ "$leeftijd_dagen" -gt "$MAX_LEEFTIJD_DAGEN" ]; then
                echo "🗑️  Verlopen ($leeftijd_dagen dagen oud, > $MAX_LEEFTIJD_DAGEN): $f — verwijderen zonder triggeren"
                rm "$f"
                verlopen=$((verlopen + 1))
                continue
              fi
            fi

            reserveringsdatum=$(date -d "$datum - 2 days" +%Y-%m-%d)
            if [ "$reserveringsdatum" = "$today" ]; then
              echo "📤 Trigger boek.yml: $datum om $tijd ($f)"
              gh workflow run boek.yml \
                --field datum="$datum" \
                --field tijd="$tijd" \
                --field speler2="$speler2" \
                --field speler3="$speler3" \
                --field speler4="$speler4"

              # Wacht 5s voor GitHub Actions om de run aan te maken,
              # pak dan de net-getriggerde run-id (concurrency-group
              # serializeert, dus latest = de onze).
              sleep 5
              RUN_ID=$(gh run list --workflow=boek.yml --limit=1 --json databaseId --jq '.[0].databaseId')
              echo "⏳ Boek-run #$RUN_ID gestart — wacht op completion (~3-5 min)..."

              # gh run watch streamt + wacht tot conclusion. Geen --exit-
              # status: anders zou faal de hele step afkappen en blijven
              # andere wachtrij-items onverwerkt.
              gh run watch "$RUN_ID" --interval 30 || true

              CONCL=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // "unknown"')
              echo "Boek-run #$RUN_ID conclusion: $CONCL"

              if [ "$CONCL" = "success" ]; then
                rm "$f"
                processed=$((processed + 1))
                echo "✅ $f verwerkt + verwijderd uit wachtrij"
              else
                echo "⚠️ $f BLIJFT IN WACHTRIJ — boek faalde ($CONCL). Handmatige"
                echo "   bekijking via Actions-issue + handmatig boeken/retry nodig."
              fi
            else
              echo "⏭️  Skip $f (reserveringsdatum $reserveringsdatum, niet vandaag $today)"
            fi
          done
          echo "Aantal verwerkt: $processed | Verlopen opgeruimd: $verlopen"

      - name: Commit verwijderde wachtrij-bestanden
        if: steps.tijd_check.outputs.skip != 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if [ -z "$(git status --porcelain wachtrij/)" ]; then
            echo "Niets te committen."
            exit 0
          fi
          git add wachtrij/
          git commit -m "wachtrij: verwerk reserveringen voor $(date +%Y-%m-%d)"
          # Retry-lus voor race condities met andere bots/commits op main.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then
              echo "✅ Push gelukt (poging $i)"
              exit 0
            fi
            echo "⚠️  Push poging $i mislukt — opnieuw na ${i}s"
            sleep "$i"
          done
          echo "❌ Push faalde na 5 pogingen"
          exit 1

      - name: Healthcheck-ping (succes)
        if: success() && env.HEALTHCHECK_PING_URL != ''
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl -fsS --retry 3 -o /dev/null "${HEALTHCHECK_PING_URL}" || true

      - name: Healthcheck-ping (fail)
        if: failure() && env.HEALTHCHECK_PING_URL != ''
        env:
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          curl -fsS --retry 3 -o /dev/null "${HEALTHCHECK_PING_URL}/fail" || true

      - name: Open issue bij failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          titel="❌ verwerk_wachtrij faalt (run #${{ github.run_number }})"
          body=$(cat <<EOF
          Wachtrij-verwerking gefaald.

          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Trigger:** ${{ github.event_name }}

          Eventuele boekingen zijn dus NIET getriggerd. Check wachtrij/ folder
          om te zien welke items nog op verwerking wachten.
          EOF
          )
          gh issue create --title "$titel" --body "$body" --label "auto-failure,wachtrij" || \
            gh issue create --title "$titel" --body "$body"
