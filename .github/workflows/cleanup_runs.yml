name: Opruimen oude Actions-runs

# Twee triggers:
# 1. Schedule: elke zondag 03:00 UTC (04:00/05:00 NL) — automatische cleanup
# 2. Workflow_dispatch: handmatig via Actions → "Run workflow" voor ad-hoc
#
# Defaults zijn aggressief (gebruikt door schedule + leeg-gelaten dispatch):
# - Behoudt altijd de 2 nieuwste runs per workflow
# - Verwijdert runs ouder dan 0 dagen (= alles behalve keep_last_n)
# - Werkt op ALLE workflows in deze repo (boek, beheer, verwerk_wachtrij,
#   haal_leden_op + deze cleanup zelf)
# - Dry-run modus om eerst te zien wat er weg zou gaan zonder echt te wissen

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Verwijder runs ouder dan N dagen (0 = aggressief: alles weg behalve keep_last_n nieuwste)'
        required: false
        default: '0'
      keep_last_n:
        description: 'Bewaar altijd minstens N nieuwste runs per workflow'
        required: false
        default: '2'
      dry_run:
        description: 'Dry-run: toon wat er weg zou gaan, geen echte delete'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # Elke zondag 03:00 UTC = 04:00 NL CET (wintertijd) / 05:00 NL CEST
    # (zomertijd). Rustig tijdstip, niet conflicterend met de 06:50 NL
    # boek-cron. GitHub native cron is best-effort; bij gemiste week
    # gebeurt 't volgende zondag alsnog — geen real-world impact.
    - cron: '0 3 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lijst + verwijder oude runs
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          # Defaults voor schedule-trigger (inputs.X is leeg buiten workflow_dispatch)
          MAX_AGE:     ${{ inputs.max_age_days || '0' }}
          KEEP_LAST:   ${{ inputs.keep_last_n  || '2' }}
          DRY_RUN:     ${{ inputs.dry_run      || 'false' }}
          REPO:        ${{ github.repository }}
        run: |
          set -e
          echo "Repo:        $REPO"
          echo "Max leeftijd:$MAX_AGE dagen"
          echo "Behouden:    $KEEP_LAST nieuwste per workflow"
          echo "Dry-run:     $DRY_RUN"
          echo ""

          drempel_epoch=$(date -d "$MAX_AGE days ago" +%s)
          totaal_weg=0
          totaal_behouden=0

          # Loop per workflow-bestand. Zo blijven altijd de N nieuwste per
          # workflow staan — anders zouden weinig-draaiende workflows soms
          # geen recente historie meer hebben.
          workflows=$(gh api "/repos/$REPO/actions/workflows" --jq '.workflows[].path')
          for wf_path in $workflows; do
            wf_name=$(basename "$wf_path")
            echo "── $wf_name ────────────────────────────────"

            # Haal alle runs van deze workflow (gesorteerd nieuwste eerst)
            runs_json=$(gh api --paginate "/repos/$REPO/actions/workflows/$wf_name/runs?per_page=100" \
              --jq '.workflow_runs[] | {id: .id, n: .run_number, created: .created_at, status: .status, concl: .conclusion}' \
              | jq -s '.')
            aantal=$(echo "$runs_json" | jq 'length')
            echo "  Totaal runs: $aantal"

            # Splits: eerste KEEP_LAST behouden, rest beoordelen op leeftijd
            te_beoordelen=$(echo "$runs_json" | jq ".[$KEEP_LAST:]")
            behouden_recent=$(echo "$runs_json" | jq "[.[0:$KEEP_LAST] | .[] | .id] | length")
            totaal_behouden=$((totaal_behouden + behouden_recent))

            beoordeel_aantal=$(echo "$te_beoordelen" | jq 'length')
            if [ "$beoordeel_aantal" = "0" ]; then
              echo "  Niets te beoordelen (≤ $KEEP_LAST runs totaal)"
              continue
            fi

            echo "$te_beoordelen" | jq -c '.[]' | while read -r r; do
              id=$(echo "$r" | jq -r '.id')
              n=$(echo "$r" | jq -r '.n')
              created=$(echo "$r" | jq -r '.created')
              status=$(echo "$r" | jq -r '.status')
              concl=$(echo "$r" | jq -r '.concl')

              created_epoch=$(date -d "$created" +%s)
              if [ "$created_epoch" -ge "$drempel_epoch" ]; then
                # Nieuwer dan drempel → behouden
                continue
              fi

              # in_progress / queued nooit verwijderen
              if [ "$status" != "completed" ]; then
                echo "  ⏭️  #$n ($created) — status=$status, skip"
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "  🔍 [DRY] #$n ($created) $concl — zou verwijderd worden"
              else
                if gh api -X DELETE "/repos/$REPO/actions/runs/$id" 2>/dev/null; then
                  echo "  🗑️  #$n ($created) $concl — verwijderd"
                else
                  echo "  ⚠️  #$n ($created) $concl — delete faalde"
                fi
              fi
            done

            # Tel weg-aantal uit de buffer-output (lokaal verloren door subshell)
          done

          # pages-build-deployment staat niet in /actions/workflows (interne
          # GitHub workflow), dus apart ophalen via /actions/runs?name=...
          echo "── pages-build-deployment ──────────────────────"
          pages_runs=$(gh api --paginate "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "pages-build-deployment") | {id: .id, n: .run_number, created: .created_at, status: .status, concl: .conclusion}' \
            | jq -s '.')
          pages_aantal=$(echo "$pages_runs" | jq 'length')
          echo "  Totaal runs: $pages_aantal"
          te_beoordelen_pages=$(echo "$pages_runs" | jq ".[$KEEP_LAST:]")
          beoordeel_pages=$(echo "$te_beoordelen_pages" | jq 'length')
          if [ "$beoordeel_pages" = "0" ]; then
            echo "  Niets te beoordelen (<= $KEEP_LAST runs totaal)"
          else
            echo "$te_beoordelen_pages" | jq -c '.[]' | while read -r r; do
              id=$(echo "$r" | jq -r '.id')
              n=$(echo "$r" | jq -r '.n')
              created=$(echo "$r" | jq -r '.created')
              status=$(echo "$r" | jq -r '.status')
              concl=$(echo "$r" | jq -r '.concl')
              created_epoch=$(date -d "$created" +%s)
              if [ "$created_epoch" -ge "$drempel_epoch" ]; then continue; fi
              if [ "$status" != "completed" ]; then
                echo "  ⏭️  #$n ($created) — status=$status, skip"
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then
                echo "  🔍 [DRY] #$n ($created) $concl — zou verwijderd worden"
              else
                if gh api -X DELETE "/repos/$REPO/actions/runs/$id" 2>/dev/null; then
                  echo "  🗑️  #$n ($created) $concl — verwijderd"
                else
                  echo "  ⚠️  #$n ($created) $concl — delete faalde"
                fi
              fi
            done
          fi

          echo ""
          if [ "$DRY_RUN" = "true" ]; then
            echo "✅ DRY-RUN voltooid. Run opnieuw met dry_run=false om écht te verwijderen."
          else
            echo "✅ Cleanup voltooid. Behouden per workflow: $KEEP_LAST nieuwste runs."
          fi
