name: Padel speelsterktes ophalen

# Draait automatisch na haal_leden_op.yml (via workflow_dispatch trigger daar)
# en kan ook handmatig gestart worden.

on:
  workflow_dispatch:

jobs:
  haal-padel-sterktes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: |
          sudo apt-get install -y xvfb
          pip install undetected-chromedriver selenium

      - name: Padel sterktes ophalen
        env:
          DISPLAY: :99
          KNLTB_BONDSNUMMER: ${{ secrets.KNLTB_BONDSNUMMER }}
          KNLTB_WACHTWOORD:  ${{ secrets.KNLTB_WACHTWOORD }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python haal_padel_sterktes.py

      - name: leden.json committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leden.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen aan leden.json — niets te committen."
            exit 0
          fi
          git commit -m "Padel speelsterktes bijgewerkt"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then
              echo "✅ Push gelukt (poging $i)"
              exit 0
            fi
            echo "⚠️  Push poging $i mislukt — opnieuw na ${i}s"
            sleep "$i"
          done
          echo "❌ Push faalde na 5 pogingen"
          exit 1

      - name: Screenshots uploaden (altijd, voor diagnose)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padel-sterktes-screenshots
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 3
