name: Padel speelsterktes ophalen

on:
  workflow_dispatch:
    inputs:
      max_leden:
        description: 'Max aantal leden verwerken (0 = allemaal)'
        required: false
        default: '0'

jobs:
  haal-padel-sterktes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installeer dependencies
        run: pip install requests

      - name: Padel sterktes ophalen
        env:
          KNLTB_LOGINNAAM:    ${{ secrets.KNLTB_LOGINNAAM }}
          KNLTB_WACHTWOORD:  ${{ secrets.KNLTB_WACHTWOORD }}
          MAX_LEDEN:         ${{ github.event.inputs.max_leden || '0' }}
        run: python haal_padel_sterktes.py

      - name: leden.json committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leden.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen -- niets te committen."
            exit 0
          fi
          git commit -m "Padel speelsterktes bijgewerkt"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then
              echo "Push gelukt (poging $i)"
              exit 0
            fi
            sleep "$i"
          done
          exit 1


